# Zebra cargo configuration

[build]
rustflags = [
    # Tachyon lives behind `zcash_unstable = "zfuture"` in librustzcash and in
    # Zebra's ZFuture network upgrade; `zcash_unstable = "nu7"` keeps
    # librustzcash's upstream NU7 (v6 transaction) surface compiled, which
    # Zebra's first-class NU7 support maps onto. Both cfgs are always on for
    # this fork.
    #
    # NOTE: a `RUSTFLAGS` environment variable REPLACES this list instead of
    # extending it, so any environment or CI job that sets `RUSTFLAGS` must
    # include both `--cfg zcash_unstable="nu7"` and
    # `--cfg zcash_unstable="zfuture"` itself.
    '--cfg',
    'zcash_unstable="nu7"',
    '--cfg',
    'zcash_unstable="zfuture"',
]
rustdocflags = [
    # The -A and -W settings must be the same as the `RUSTDOCFLAGS` in:
    # https://github.com/ZcashFoundation/zebra/blob/main/.github/workflows/docs-deploy-firebase.yml#L68

    # Links in public docs can point to private items.
    "-Arustdoc::private_intra_doc_links",
    # Reference-style doc links whose target matches the display text are flagged
    # by newer nightly rustdoc; suppress like private_intra_doc_links above.
    "-Arustdoc::redundant_explicit_links",
]

[env]
RUST_BACKTRACE="1"

[profile.profiling]
inherits = "release"
debug = true
