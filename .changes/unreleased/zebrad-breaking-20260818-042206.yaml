project: zebrad
kind: breaking
body: 'Tachyon (v7 transactions) now activates at the ZFuture network upgrade instead of NU7, following librustzcash''s move of tachyon behind `zcash_unstable = "zfuture"`. NU7 is now the upstream v6-transaction upgrade, and `zebrad` builds with both `zcash_unstable = "nu7"` and `zcash_unstable = "zfuture"`. Tachyon state written by an earlier build activates at a different height and cannot be reused ([tachyon-zcash/zebra#68](https://github.com/tachyon-zcash/zebra/pull/68))'
